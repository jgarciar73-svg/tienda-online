<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tus estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="#">Mi Tienda Online</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#productos">Productos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contacto</a>
                </li>

            </ul>

            <a href="#" class="btn btn-outline-light position-relative">

                <i class="bi bi-cart3"></i>

                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

                    <span id="contadorCarrito">0</span>

                </span>

            </a>

        </div>

    </div>
</nav>

<!-- ================= CAROUSEL ================= -->

<div id="carouselTienda" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="carousel-1.jpg.png" class="d-block w-100 carousel-img" alt="">
        </div>

        <div class="carousel-item">
            <img src="carousel-2.jpg.png" class="d-block w-100 carousel-img" alt="">
        </div>

        <div class="carousel-item">
            <img src="carousel-3.jpg.png" class="d-block w-100 carousel-img" alt="">
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselTienda" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselTienda" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<!-- ================= CONTENIDO ================= -->

<div class="container my-4" id="productos">

    <div class="row">

        <!-- Categorías -->

        <div class="col-sm-3">

            <h5>Categorías</h5>

            <div class="list-group">

                <a href="#" class="list-group-item active">Todas</a>
                <a href="#" class="list-group-item">Categoría 1</a>
                <a href="#" class="list-group-item">Categoría 2</a>
                <a href="#" class="list-group-item">Categoría 3</a>
                <a href="#" class="list-group-item">Categoría 4</a>
                <a href="#" class="list-group-item">Categoría 5</a>
                <a href="#" class="list-group-item">Categoría 6</a>

            </div>

        </div>

        <!-- Productos -->

        <div class="col-sm-9">

            <h4 class="mb-3">Productos</h4>

            <div class="row" id="contenedorProductos">

                <div class="col-12 text-center">

                    <div class="spinner-border text-primary"></div>

                    <p>Cargando productos...</p>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center py-3">

    Diseñado por: Joshua Eduardo Garcia Reyes - 1890-22-5831

</footer>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= JAVASCRIPT ================= -->

<script>

const url = "https://backservicetest-g8emcvdff0fqe2b8.canadacentral-01.azurewebsites.net/api/producto";

const contenedor = document.getElementById("contenedorProductos");

const contadorCarrito = document.getElementById("contadorCarrito");

let carrito = 0;

async function cargarProductos(){

    try{

        const response = await fetch(url);

        if(!response.ok){

            throw new Error("Error al obtener los productos");

        }

        const productos = await response.json();

        contenedor.innerHTML = "";

        productos.forEach(producto=>{

            const col = document.createElement("div");

            col.className = "col-sm-12 col-md-4 mb-4";

          let precioHTML = "";

if (producto.enOferta) {

    precioHTML = `
        <span class="text-danger fw-bold">
            Q${parseFloat(producto.precioOferta).toFixed(2)}
        </span><br>

        <small class="text-muted text-decoration-line-through">
            Q${parseFloat(producto.precio).toFixed(2)}
        </small>
    `;

} else {

    precioHTML = `
        <span class="fw-bold">
            Q${parseFloat(producto.precio).toFixed(2)}
        </span>
    `;

}

col.innerHTML = `

<div class="card h-100 shadow">

    <img src="${producto.imagen}" class="card-img-top img-fluid" alt="${producto.nombre}">

    <div class="card-body d-flex flex-column">

        <h5 class="card-title">
            ${producto.nombre}
        </h5>

        <p class="card-text">
            ${producto.descripcion}
        </p>

        <p>${precioHTML}</p>

        <button class="btn btn-primary mt-auto w-100 agregarCarrito">
            Agregar al carrito
        </button>

    </div>

</div>

`;
            col.querySelector(".agregarCarrito").addEventListener("click",function(){

                carrito++;

                contadorCarrito.textContent = carrito;

            });

            contenedor.appendChild(col);

        });

    }catch(error){

        console.error(error);

        contenedor.innerHTML = `

            <div class="col-12">

                <div class="alert alert-danger">

                    No se pudieron cargar los productos.

                </div>

            </div>

        `;

    }

}

cargarProductos();

</script>

</body>
</html>
